services:
  - type: web
    name: options-alpha-agent
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: DRY_RUN
        value: "false"
      - key: SCAN_TRIGGER_TOKEN
        generateValue: true
