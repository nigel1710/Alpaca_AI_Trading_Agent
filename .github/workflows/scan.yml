name: Trigger scan

# Scheduling now lives in the app itself (agent/scheduler.py), because
# GitHub's scheduled-workflow runner never fired for this repo — zero
# scheduled runs over several hours inside the window, while manual
# dispatches worked every time. This workflow is kept as a manual escape
# hatch for forcing a scan (e.g. to refresh the demo before presenting).
on:
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/scan
        run: |
          curl -sf -X POST \
            -H "X-Scan-Token: ${{ secrets.SCAN_TRIGGER_TOKEN }}" \
            "${{ vars.SCAN_URL || 'https://options-alpha-agent.onrender.com' }}/api/scan"
